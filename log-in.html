<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="PayOne HTML Template">
    <meta name="keywords" content="PayOne HTML Template">
    <meta name="robots" content="INDEX,FOLLOW">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>Connexion - Payone Banking</title>
    <!-- Favicon -->
     <link rel="shortcut icon" href="assets/images/logo/favicon.png">
    <!-- slider -->
    <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">
    <!-- magnfic popup -->
    <link rel="stylesheet" href="assets/css/magnific-popup.css">
    <!-- aos animation -->
    <link rel="stylesheet" href="assets/css/aos-animation.css">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <!-- Main css -->
    <link rel="stylesheet" href="assets/css/main.css">
</head> 
<body class="position-relative">
    
<!--==================== Preloader Start ====================-->
  <div class="preloder">
    <div class="position-relative tw-w-76-px tw-h-76-px d-flex justify-content-center align-items-center">
      <img src="assets/images/icon/preloder-img1.png" alt="Img" class="tw-w-8">
      <div class="preloder__exchange__img w-100 h-100">
        <img src="assets/images/icon/preloder-img2.png" alt="Img" class="w-100 h-100 animation-rotation">
      </div>
    </div>
  </div>
<!--==================== Preloader End ====================-->

<!--==================== Overlay Start ====================-->
<div class="overlay"></div>
<!--==================== Overlay End ====================-->

<!--==================== Sidebar Overlay End ====================-->
<div class="side-overlay"></div>
<!--==================== Sidebar Overlay End ====================-->

<!-- Custom Toast Message start -->
<div id="toast-container"></div>
<!-- Custom Toast Message End -->

<!-- ==================== Scroll to Top End Here ==================== -->
<div class="progress-wrap cursor-big">
  <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
      <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
  </svg>
</div>
<!-- ==================== Scroll to Top End Here ==================== -->

<!-- Custom Cursor Start -->
  <div class="cursor"></div>
  <span class="dot"></span>
<!-- Custom Cursor End -->

<section class="position-relative">
   
    <div class="d-flex">
        <div class="flex-grow-1">
            <div class="max-w-526-px w-100 log-in-card tw-px-6 tw-py-12 mx-auto">
                 <a href="index.html" class="tw-mb-188-px">
                    <img src="assets/images/logo/logo2.png" alt="Image" class="">
                </a>
                <h4 class="fw-medium text-primary-50 tw-mb-8">Bienvenue sur PayOne</h4>
                
                <!-- ============= FORMULAIRE DE CONNEXION ============= -->
                <form id="login-form">
                    
                    <div class="tw-mb-6 flex-wrap border-before position-relative text-center z-1">
                        <span class="fw-semibold text-dark-500 tw-text-4 bg-white tw-px-4">Connexion</span>
                        <span class="position-absolute w-100 border-bottom border-neutral-50 tw-start-0 top-50 translate-middle-y z-n1"></span>
                    </div>
                    
                    <!-- Email -->
                    <div class="tw-mb-6">
                        <label for="email" class="fw-semibold tw-text-4 text-primary-50 tw-mb-3">Email*</label>
                        <input type="email" id="email" name="email" placeholder="votre@email.com" class="fw-semibold tw-text-4 text-dark-500 tw-px-4 tw-py-3 border-neutral-05 border rounded-3 w-100 focus-visible-border-main-600" required>
                    </div>
                    
                    <!-- Mot de passe -->
                    <div class="tw-mb-3">
                        <label for="password" class="fw-semibold tw-text-4 text-primary-50 tw-mb-3">Mot de passe*</label>
                        <div class="position-relative">
                            <input type="password" class="form-control border-neutral-05 border rounded-3 w-100 focus-visible-border-main-600 fw-semibold text-dark-500 tw-px-4 tw-py-3 tw-rounded-lg shadow-none" id="password" name="password" placeholder="Mot de passe" required>
                            <span class="toggle-password position-absolute top-50 tw-end-0 tw-me-4 tw-text-xl text-neutral-600 tw--translate-y-50 ph-bold ph-eye-slash" id="#password"></span>
                        </div>
                    </div>
                    
                    <!-- Se souvenir / Mot de passe oublié -->
                    <div class="d-flex align-items-center justify-content-between tw-gap-3 flex-wrap tw-mb-8">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="remember">
                            <label class="form-check-label fw-semibold" for="remember">
                                Se souvenir de moi
                            </label>
                        </div>
                        <a href="javascript:void(0)" class="fw-semibold tw-text-4 text-primary-600 hover-underline">Mot de passe oublié ?</a>
                    </div>
                    
                    <!-- Bouton de connexion -->
                    <button type="submit" class="text-white bg-base-two-600 w-100 tw-py-3 rounded-3 text-center tw-mb-3">Se connecter</button>
                    
                    <!-- Lien vers inscription -->
                    <span class="fw-semibold tw-text-4 text-primary-50 text-center justify-content-center d-flex">
                        Pas encore de compte ?
                        <a href="sign-up.html" class="fw-semibold text-primary-600"> S'inscrire</a>
                    </span>
                </form>
            </div>
        </div>
        <div class="w-50 d-lg-block d-none ">
            <img src="assets/images/thumbs/long-in-img-1.png" alt="Image" class="w-100 h-100 object-fit-cover">
        </div>
    </div>
</section>

    <!-- Jquery js -->
    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <!-- phosphor Js -->
    <script src="assets/js/phosphor-icon.js"></script>
    <!-- Bootstrap Bundle Js -->
    <script src="assets/js/boostrap.bundle.min.js"></script>

    <!-- GSAP js -->
    <script src="assets/js/gsap.min.js"></script>
    <!-- SplitText -->
    <script src="assets/js/SplitText.min.js"></script>
    <!-- Scroll Trigger -->
    <script src="assets/js/swiper-bundle.min.js"></script>
    <!-- marquee js -->
    <script src="assets/js/marquee-main.js"></script>
    <!-- swper slider -->
    <script src="assets/js/ScrollTrigger.min.js"></script>
    <!-- ScrollSmoother -->
    <script src="assets/js/ScrollSmoother.min.js"></script>
    <!-- aos animation -->
    <script src="assets/js/aos-animation.js"></script>
    <!-- counter up -->
    <script src="assets/js/counter-up.main.js"></script>
    <!-- custom GSAP -->
    <script src="assets/js/custom-gsap.js"></script>
    <!-- magnific popup -->
    <script src="assets/js/magific-popup.js"></script>

    <!-- main js -->
    <script src="assets/js/main.js"></script>
    
    <!-- ============= SCRIPT D'AUTHENTIFICATION ============= -->
    <script src="assets/js/auth.js"></script>

</body>
</html>
