<!-- ========================================

     À intégrer dans dashboard.html et autres pages
     ======================================== -->

<div class="credit-card purple">
    <!-- Pattern de fond décoratif -->
    <svg class="card-pattern" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path fill="currentColor" d="M47.5,-57.3C59.7,-49.5,66.4,-32.5,69.2,-15.1C72,2.3,71,20.1,63.2,34.3C55.4,48.5,40.8,59.1,24.5,65.1C8.2,71.1,-9.8,72.5,-26.1,67.8C-42.4,63.1,-57,52.3,-66.5,37.5C-76,22.7,-80.4,4,-77.8,-13.5C-75.2,-31,-65.6,-47.3,-52.1,-54.8C-38.6,-62.3,-19.3,-60.9,-0.5,-60.3C18.3,-59.7,36.6,-59.9,47.5,-57.3Z" transform="translate(100 100)" />
    </svg>
    
    <!-- Nom du titulaire -->
    <div class="card-holder-name" id="cardHolderName">
        CHARGEMENT...
    </div>
    
    <!-- Chip de la carte -->
    <div class="credit-card-chip"></div>
    
    <!-- Logo sans contact -->
    <div class="contactless-logo">
        <i class="ph ph-waves"></i>
    </div>
    
    <!-- Label du solde -->
    <div class="card-balance-label">
        Solde Disponible
    </div>
    
    <!-- Montant du solde -->
    <div class="card-balance-amount" id="cardBalanceAmount">
        0.00 €
    </div>
    
    <!-- Logo de la banque -->
    <div class="card-bank-logo">
        PAYONE
    </div>
</div>

<!-- Script pour mettre à jour la carte -->
<script>
// ========================================
// 💳 MISE À JOUR DE LA CARTE DE CRÉDIT
// ========================================

// Cette fonction peut être appelée depuis client.js ou tout autre script
function updateCreditCard(userName, balance) {
    const cardHolderName = document.getElementById('cardHolderName');
    const cardBalanceAmount = document.getElementById('cardBalanceAmount');
    
    if (cardHolderName) {
        // Formater le nom en majuscules
        cardHolderName.textContent = userName.toUpperCase();
    }
    
    if (cardBalanceAmount) {
        // Formater le solde avec séparateurs de milliers
        const formattedBalance = new Intl.NumberFormat('fr-FR', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(balance);
        
        cardBalanceAmount.textContent = formattedBalance + ' €';
    }
}

// Exemple d'utilisation :
// updateCreditCard('John Doe', 1234.56);
</script>
